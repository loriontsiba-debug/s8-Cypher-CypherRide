<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BraCovoit — Inscription</title>
  <link rel="stylesheet" href="inscription.css">
<link rel="stylesheet" href="/frontend/navigation_style/navigation.css" />
  <!-- <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet"> -->
</head>
<body id="page-inscription">
    
  <!-- NAVIGATION -->
  <header class="site-header">
      <div class="header-inner">
        <!-- partie logo -->
        <a href="../../index.html">
          <img src="../images/logo.jpg" width="250" alt="BraCovoit logo" />
        </a>

        <!-- partie bouton hamburguer -->
        <button class="burger-btn" id="burgerBtn" aria-label="ouvrir le menu">
          <span></span>
          <span></span>
          <span></span>
        </button>

        <!-- partie menu -->
        <nav
          class="nav-principale"
          id="navPrin"
          aria-label="Navigation principale"
          aria-expanded="false"
        >
          

          <!-- partie menu -->
          <nav class="nav-principale" id="navPrin" aria-label="Navigation principale" aria-expanded="false">
            <a href="/frontend/accueil/index.html" class="nav-link active">Accueil</a>
            <a href="/frontend/recherche/recherche.html" class="nav-link">Rechercher</a>
            <a href="/frontend/proposer/proposer.html" class="nav-link">Proposer un trajet</a>
            <a href="/frontend/mes-trajets/mes-trajets.html" class="nav-link">Mes trajets</a>
            <a href="/frontend/dashboard/dashboard.html" class="nav-link">Dashboard</a>


          <div class="header-actions">
            <div id="nav-session"></div>
          </div>
        </nav>
      </div>
    </header>

  <main>
    <!-- =====================================================================
         FORMULAIRE — TODO (Dev FS7)
         Mettre en forme le formulaire d'inscription : nom, téléphone,
         mot de passe. Prévoir un layout clair en colonne, avec des labels
         visibles pour chaque champ.
  -->
  <main class="auth-container">
    <div class="auth-card">
      <h1 class="auth-title">Créer un compte</h1>
      <p class="auth-subtitle">Rejoignez BraCovoit en quelques secondes.</p>

      <!-- Sélecteur Passager / Conducteur -->
      <div class="role-selector">
        <button type="button" class="role-btn active">Passager</button>
        <button type="button" class="role-btn">Conducteur</button>
      </div>


      <form id="form-inscription" class="auth-form">
        <div class="form-row">
          <input type="text" placeholder="Prénom">
          <input type="text" id="i-nom" placeholder="Nom">
        </div>

        <div class="form-group">
          <input type="tel" id="i-telephone" placeholder="Téléphone (ex: 06 12 34 56)">
        </div>

        <div class="form-group">
          <input type="password" id="i-mot-de-passe" placeholder="Mot de passe (min 6 caractères)">
        </div>

        <button type="submit" class="btn-submit">Créer mon compte</button>
      </form>

      <!-- Zone d'erreurs -->
      <div id="erreurs-form" hidden class="alert-error"></div>

      <div class="auth-footer">
        <p>Déjà un compte ? <a href="../login/login.html">Se connecter</a></p>
      </div>
    </div>
  </main>

  <div id="erreur-globale" hidden class="alert-error-global"></div>

  <script>
    // Sélecteur Passager / Conducteur
    document.querySelectorAll('.role-btn').forEach(button => {
      button.addEventListener('click', (e) => {
        e.preventDefault(); 
        document.querySelectorAll('.role-btn').forEach(btn => btn.classList.remove('active'));
        button.classList.add('active');
      });
    });

    // Menu Burger
    const menuToggle = document.getElementById('menuToggle');
    const navMenu = document.getElementById('navMenu');

    menuToggle.addEventListener('click', () => {
      menuToggle.classList.toggle('active');
      navMenu.classList.toggle('active');
    });
  </script>

  <!-- SCRIPTS EXTERNES -->
  <script src="../functions.js"></script>
  <script src="../main.js"></script>
</body>
</html>
