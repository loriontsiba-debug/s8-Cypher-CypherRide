<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BraCovoit — Inscription</title>
  <link rel="stylesheet" href="inscription.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body id="page-inscription">

  <!-- NAVIGATION AVEC MENU BURGER -->
  <header class="header-nav">
    <div class="logo">
      <span class="logo-icon">BC</span>
      <span class="logo-text">BraCovoit</span>
    </div>

    <!-- Bouton Burger (visible uniquement sur mobile) -->
    <button class="menu-toggle" id="menuToggle" aria-label="Ouvrir le menu">
      <span class="bar"></span>
      <span class="bar"></span>
      <span class="bar"></span>
    </button>

    <!-- Conteneur pliable du menu -->
    <div class="nav-menu" id="navMenu">
      <nav class="nav-links">
        <a href="../index.html">Accueil</a>
        <a href="../recherche/recherche.html">Rechercher</a>
        <a href="../proposer/proposer.html">Proposer un trajet</a>
        <a href="../trajets/trajets.html">Mes trajets</a>
        <a href="../dashboard/dashboard.html">Dashboard</a>
      </nav>
      
      <!-- L'id nav-session est placé ici pour recevoir le contenu injecté par main.js -->
      <div class="nav-actions" id="nav-session"></div>
    </div>
  </header>

  <main class="auth-container">
    <div class="auth-card">
      <h1 class="auth-title">Créer un compte</h1>
      <p class="auth-subtitle">Rejoignez BraCovoit en quelques secondes.</p>

      <!-- Sélecteur Passager / Conducteur -->
      <div class="role-selector">
        <button type="button" class="role-btn active">Passager</button>
        <button type="button" class="role-btn">Conducteur</button>
      </div>

      <form id="form-inscription" class="auth-form">
        <div class="form-row">
          <input type="text" placeholder="Prénom">
          <input type="text" id="i-nom" placeholder="Nom">
        </div>

        <div class="form-group">
          <input type="tel" id="i-telephone" placeholder="Téléphone (ex: 06 12 34 56)">
        </div>

        <div class="form-group">
          <input type="password" id="i-mot-de-passe" placeholder="Mot de passe (min 6 caractères)">
        </div>

        <button type="submit" class="btn-submit">Créer mon compte</button>
      </form>

      <!-- Zone d'erreurs -->
      <div id="erreurs-form" hidden class="alert-error"></div>

      <div class="auth-footer">
        <p>Déjà un compte ? <a href="../login/login.html">Se connecter</a></p>
      </div>
    </div>
  </main>

  <div id="erreur-globale" hidden class="alert-error-global"></div>

  <script>
    // Gestion du sélecteur Passager / Conducteur
    document.querySelectorAll('.role-btn').forEach(button => {
      button.addEventListener('click', (e) => {
        e.preventDefault(); 
        document.querySelectorAll('.role-btn').forEach(btn => btn.classList.remove('active'));
        button.classList.add('active');
      });
    });

    // Gestion de l'ouverture/fermeture du Menu Burger
    const menuToggle = document.getElementById('menuToggle');
    const navMenu = document.getElementById('navMenu');

    menuToggle.addEventListener('click', () => {
      menuToggle.classList.toggle('active');
      navMenu.classList.toggle('active');
    });
  </script>

  <!-- SCRIPTS EXTERNES -->
  <script src="../functions.js"></script>
  <script src="../main.js"></script>
</body>
</html>
