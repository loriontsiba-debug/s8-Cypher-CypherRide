  <main>
    <h1>Proposer un trajet</h1>
    <p>Publiez votre trajet et trouvez des passagers sur votre route.</p>
    <!-- =====================================================================
         FORMULAIRE — TODO (Dev FS4)
         Mettre en forme le formulaire de proposition de trajet : les deux
         sélecteurs de quartier (départ/arrivée) sont remplis dynamiquement
         par main.js via l'API /api/quartiers, vous stylez leur apparence.
         Prévoir un layout clair en colonne, avec des labels visibles pour
         chaque champ.

         *** NE PAS MODIFIER les id ci-dessous — main.js les utilise ***
         ===================================================================== -->
    <form id="form-proposer">
      <label for="p-depart">Quartier de départ</label><br>
      <select id="p-depart"></select><br>

      <label for="p-arrivee">Quartier d'arrivée</label>
      <select id="p-arrivee"></select><br>

      <label for="p-heure">Heure (HH:MM)</label><br>
      <input type="text" id="p-heure" placeholder="07:30"><br>

      <label for="p-places">Places disponibles</label><br>
      <input type="number" id="p-places" min="1" max="8"><br>

      <label for="p-prix">Prix par place (FCFA)</label><br>
      <input type="number" id="p-prix" min="1"><br>

      <button type="submit">Publier mon trajet</button><br>
    
    </form>

    <!-- Zone d'erreurs de validation — TODO (Dev FS4) : mettre en forme la
         liste <ul><li> injectée par main.js en cas de formulaire invalide.
         NE PAS MODIFIER l'id. -->
    <div id="erreurs-form" hidden></div>

    <!-- BLOC D'AIDE — TODO (Dev FS4) : encart explicatif optionnel
         (ex. rappel que le prix est libre, conseils de sécurité) -->
  </main>

  <div id="erreur-globale" hidden></div>
