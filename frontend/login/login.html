<html lang="fr">

</head>
<body id="page-login">

  <!-- NAVIGATION -->
  <header class="site-header">
      <div class="header-inner">
        <!-- partie logo -->
        <a href="../../index.html">
          <img src="../images/logo.jpg" width="250" alt="BraCovoit logo" />
        </a>

        <!-- partie bouton hamburguer -->
        <button class="burger-btn" id="burgerBtn" aria-label="ouvrir le menu">
          <span></span>
          <span></span>
          <span></span>
        </button>

        <!-- partie menu -->
        <nav
          class="nav-principale"
          id="navPrin"
          aria-label="Navigation principale"
          aria-expanded="false"
        >
          

          <!-- partie menu -->
          <nav class="nav-principale" id="navPrin" aria-label="Navigation principale" aria-expanded="false">
            <a href="../accueil/index.html" class="nav-link active">Accueil</a>
            <a href="../recherche/recherche.html" class="nav-link">Rechercher</a>
            <a href="../proposer/proposer.html" class="nav-link">Proposer un trajet</a>
            <a href="../mes-trajets/mes-trajets.html" class="nav-link">Mes trajets</a>
            <a href="../dashboard/dashboard.html" class="nav-link">Dashboard</a>


          <div class="header-actions">
            <div id="nav-session"></div>
          </div>
        </nav>
      </div>
    </header>


  <main>
    <!-- =====================================================================
         FORMULAIRE — TODO (Dev FS7)
         Mettre en forme le formulaire de connexion : téléphone, mot de
         passe. Prévoir un layout clair en colonne, avec des labels

         visibles pour chaque champ.
      Zone d'erreurs -->
   


  <main class="auth-container">
    <div class="auth-card text-center">
      <div class="auth-logo-badge">BC</div>
      <h1 class="auth-title">Connexion</h1>
      <p class="auth-subtitle">Bienvenue sur BraCovoit</p>

      <form id="form-login" class="auth-form">
        <div class="form-group">
          <input type="tel" id="l-telephone" placeholder="Numéro de téléphone">
        </div>

        <div class="form-group">
          <input type="password" id="l-mot-de-passe" placeholder="Mot de passe">
        </div>


        <div class="forgot-password">
          <a href="#">Mot de passe oublié ?</a>
        </div>

        <button type="submit" class="btn-submit">Se connecter</button>
      </form>

    


      
      <div id="erreurs-form" hidden class="alert-error"></div>

      <div class="auth-footer">
        <p>Pas encore de compte ? <a href="../inscription/inscription.html">S'inscrire</a></p>
      </div>

    </div>
  </main>

  <div id="erreur-globale" hidden class="alert-error-global"></div>

  <!-- SCRIPT DU MENU BURGER -->
  <script>
    const menuToggle = document.getElementById('menuToggle');
    const navMenu = document.getElementById('navMenu');

    menuToggle.addEventListener('click', () => {
      menuToggle.classList.toggle('active');
      navMenu.classList.toggle('active');
    });
  </script>

  <!-- SCRIPTS EXTERNES -->
  <script src="../functions.js"></script>
  <script src="../main.js"></script>
</body>
</html>
