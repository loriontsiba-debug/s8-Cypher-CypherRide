<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BraCovoit — Connexion</title>
  <link rel="stylesheet" href="login.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body id="page-login">

  <!-- NAVIGATION -->
  <header class="header-nav">
    <div class="logo">
      <img src="../images/logo.jpg" alt="BraCovoit Logo" class="logo-img">
    </div>

    <!-- Bouton Burger (mobile) -->
    <button class="menu-toggle" id="menuToggle" aria-label="Ouvrir le menu">
      <span class="bar"></span>
      <span class="bar"></span>
      <span class="bar"></span>
    </button>


        <div class="header-actions">
          <div id="nav-session"></div>
        </div>

    <!-- Conteneur pliable du menu -->
    <div class="nav-menu" id="navMenu">
      <nav class="nav-links">
         <a href="../../index.html" class="nav-link">Accueil</a>
        <a href="../recherche/recherche.html" class="nav-link">Rechercher</a>
        <a href="../proposer/proposer.html" class="nav-link">Proposer un trajet</a>
        <a href="../mes-trajets/mes-trajets.html" class="nav-link">Mes trajets</a>
        <a href="../dashboard/dashboard.html" class="nav-link">Dashboard</a>

      </nav>
      
      <!-- L'id nav-session est placé ici pour recevoir le contenu injecté par main.js -->
      <div class="nav-actions" id="nav-session"></div>
    </div>
  </header>


  <main>
    <!-- =====================================================================
         FORMULAIRE — TODO (Dev FS7)
         Mettre en forme le formulaire de connexion : téléphone, mot de
         passe. Prévoir un layout clair en colonne, avec des labels
         visibles pour chaque champ.

  <main class="auth-container">
    <div class="auth-card text-center">
      <div class="auth-logo-badge">BC</div>
      <h1 class="auth-title">Connexion</h1>
      <p class="auth-subtitle">Bienvenue sur BraCovoit</p>

      <form id="form-login" class="auth-form">
        <div class="form-group">
          <input type="tel" id="l-telephone" placeholder="Numéro de téléphone">
        </div>

        <div class="form-group">
          <input type="password" id="l-mot-de-passe" placeholder="Mot de passe">
        </div>


        <div class="forgot-password">
          <a href="#">Mot de passe oublié ?</a>
        </div>

        <button type="submit" class="btn-submit">Se connecter</button>
      </form>

      <!-- Zone d'erreurs -->
      <div id="erreurs-form" hidden class="alert-error"></div>

      <div class="auth-footer">
        <p>Pas encore de compte ? <a href="../inscription/inscription.html">S'inscrire</a></p>
      </div>

    </div>
  </main>

  <div id="erreur-globale" hidden class="alert-error-global"></div>

  <!-- SCRIPT DU MENU BURGER -->
  <script>
    const menuToggle = document.getElementById('menuToggle');
    const navMenu = document.getElementById('navMenu');

    menuToggle.addEventListener('click', () => {
      menuToggle.classList.toggle('active');
      navMenu.classList.toggle('active');
    });
  </script>

  <!-- SCRIPTS EXTERNES -->
  <script src="../functions.js"></script>
  <script src="../main.js"></script>
</body>
</html>
